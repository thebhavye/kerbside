<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerbside Demo Walk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
html,body{height:100%;margin:0;background:#fff;color:#1a1a1a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid #ddd}
h1{font-size:1.15rem;margin:0 0 4px}
.stats{font-size:.85rem;color:#444;display:flex;flex-wrap:wrap;gap:2px 14px}
#map{flex:1;min-height:320px}
.legend{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);
  font-size:12px;line-height:1.6;max-height:40vh;overflow:auto}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.dash{width:8px;height:8px;border:2px dashed #222}
.legend summary{cursor:pointer;font-weight:600;padding:2px 0}
.legend .cat{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 0;
  font:inherit;color:inherit;cursor:pointer}
.legend .cat.off{opacity:.4;text-decoration:line-through}
.legend .hint{color:#555;font-size:.9em;margin-top:2px}
.legend details:not([open]) summary{padding:0}
.search{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);width:min(260px,62vw)}
.search form{display:flex}
.search input{flex:1;min-width:0;border:0;padding:8px 10px;font-size:16px;border-radius:6px 0 0 6px;
  background:transparent;color:#1a1a1a}
.search button[type=submit]{border:0;border-left:1px solid #ddd;background:#f4f4f4;color:#1a1a1a;padding:0 12px;
  font-size:15px;border-radius:0 6px 6px 0;cursor:pointer}
.search .results{border-top:1px solid #ddd;max-height:40vh;overflow:auto}
.search .results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;
  background:#fff;color:#1a1a1a;padding:8px 10px;font-size:13px;line-height:1.35;cursor:pointer}
.search .msg{padding:8px 10px;font-size:13px;color:#555}
.popup h3{margin:0 0 4px;font-size:14px}
.popup .q{font-style:italic;color:#555;margin:6px 0}
.popup .warn{color:#a15c00}
.popup .copy{display:block;width:100%;margin-top:8px;padding:8px;border:1px solid #ccc;border-radius:6px;
  background:#f4f4f4;color:#1a1a1a;font-size:14px;cursor:pointer}
@media (max-width:600px){h1{font-size:1rem}.stats{font-size:.78rem}.legend{font-size:11px}}
</style>
</head>
<body>
<header><h1>Kerbside Demo Walk</h1><div class="stats"><span>10 Oct 2026</span><span>599 m walked</span><span>8 min</span><span>8 problems (2 severe)</span><span>2 good things</span><span>1 to review</span></div></header>
<div id="map"></div>
<script>
const DATA = {"track": [[13.0, 80.265], [13.0, 80.265058], [13.0, 80.265115], [13.0, 80.265173], [13.0, 80.265231], [13.0, 80.265288], [13.0, 80.265346], [13.0, 80.265403], [13.0, 80.265461], [13.0, 80.265519], [13.0, 80.265576], [13.0, 80.265634], [13.0, 80.265692], [13.0, 80.265749], [13.0, 80.265807], [13.0, 80.265864], [13.0, 80.265922], [13.0, 80.26598], [13.0, 80.266037], [13.0, 80.266095], [13.0, 80.266152], [13.0, 80.26621], [13.0, 80.266268], [13.0, 80.266325], [13.0, 80.266383], [13.0, 80.266441], [13.0, 80.266498], [13.0, 80.266556], [13.0, 80.266613], [13.0, 80.266671], [13.0, 80.266729], [13.0, 80.266786], [13.0, 80.266844], [13.0, 80.266902], [13.0, 80.266959], [13.0, 80.267017], [13.0, 80.267074], [13.0, 80.267132], [13.0, 80.26719], [13.0, 80.267247], [13.0, 80.267305], [13.0, 80.267363], [13.0, 80.26742], [13.0, 80.267478], [13.0, 80.267535], [13.0, 80.267593], [13.0, 80.267651], [13.0, 80.267708], [13.0, 80.267766], [13.000056, 80.267766], [13.000112, 80.267766], [13.000168, 80.267766], [13.000225, 80.267766], [13.000281, 80.267766], [13.000337, 80.267766], [13.000393, 80.267766], [13.000449, 80.267766], [13.000505, 80.267766], [13.000561, 80.267766], [13.000618, 80.267766], [13.000674, 80.267766], [13.00073, 80.267766], [13.000786, 80.267766], [13.000842, 80.267766], [13.000898, 80.267766], [13.000955, 80.267766], [13.001011, 80.267766], [13.001067, 80.267766], [13.001123, 80.267766], [13.001179, 80.267766], [13.001235, 80.267766], [13.001291, 80.267766], [13.001347, 80.267766], [13.001404, 80.267766], [13.00146, 80.267766], [13.001516, 80.267766], [13.001572, 80.267766], [13.001628, 80.267766], [13.001684, 80.267766], [13.001741, 80.267766], [13.001797, 80.267766], [13.001853, 80.267766], [13.001909, 80.267766], [13.001965, 80.267766], [13.002021, 80.267766], [13.002077, 80.267766], [13.002133, 80.267766], [13.00219, 80.267766], [13.002246, 80.267766], [13.002302, 80.267766], [13.002358, 80.267766], [13.002414, 80.267766], [13.00247, 80.267766], [13.002527, 80.267766], [13.002583, 80.267766], [13.002639, 80.267766], [13.002695, 80.267766]], "categories": {"broken_footpath": {"label": "Broken footpath", "color": "#d7301f"}, "no_footpath": {"label": "No footpath", "color": "#7a0177"}, "obstruction": {"label": "Footpath obstruction", "color": "#ec7014"}, "blocked_drain": {"label": "Blocked or open drain", "color": "#6a51a3"}, "waterlogging": {"label": "Waterlogging", "color": "#2171b5"}, "garbage": {"label": "Garbage", "color": "#8c6d31"}, "streetlight_out": {"label": "Streetlight not working", "color": "#b8860b"}, "unsafe_crossing": {"label": "Unsafe crossing", "color": "#e7298a"}, "other_problem": {"label": "Other problem", "color": "#737373"}, "shade_tree": {"label": "Shade tree", "color": "#238b45"}, "good_footpath": {"label": "Good footpath", "color": "#1b9e77"}}, "findings": [{"id": 1, "category": "broken_footpath", "label": "Broken footpath", "severity": 3, "severity_label": "severe", "summary": "A big crack and one slab is missing from the footpath.", "quote": "Footpath is broken here, big crack and one slab is missing. Someone could easily trip on this at night.", "time_local": "2026-10-10 07:30:20", "needs_review": false, "positive": false, "line_ids": [2, 3], "lat": 13.0, "lon": 80.2652363, "osm": "https://www.openstreetmap.org/?mlat=13.000000&mlon=80.265236#map=19/13.000000/80.265236"}, {"id": 2, "category": "blocked_drain", "label": "Blocked or open drain", "severity": 2, "severity_label": "moderate", "summary": "The drain is blocked with lots of plastic.", "quote": "Drain is blocked, lots of plastic in it.", "time_local": "2026-10-10 07:30:55", "needs_review": false, "positive": false, "line_ids": [4], "lat": 13.0, "lon": 80.2656382, "osm": "https://www.openstreetmap.org/?mlat=13.000000&mlon=80.265638#map=19/13.000000/80.265638"}, {"id": 3, "category": "shade_tree", "label": "Shade tree", "severity": 1, "severity_label": "minor", "summary": "A huge rain tree provides nice shade.", "quote": "Huge rain tree here, nice shade.", "time_local": "2026-10-10 07:31:50", "needs_review": false, "positive": true, "line_ids": [6], "lat": 13.0, "lon": 80.2662722, "osm": "https://www.openstreetmap.org/?mlat=13.000000&mlon=80.266272#map=19/13.000000/80.266272"}, {"id": 4, "category": "obstruction", "label": "Footpath obstruction", "severity": 2, "severity_label": "moderate", "summary": "Cars are parked fully on the footpath.", "quote": "Cars parked fully on the footpath, I have to walk on the road.", "time_local": "2026-10-10 07:32:20", "needs_review": false, "positive": false, "line_ids": [7], "lat": 13.0, "lon": 80.2666173, "osm": "https://www.openstreetmap.org/?mlat=13.000000&mlon=80.266617#map=19/13.000000/80.266617"}, {"id": 5, "category": "streetlight_out", "label": "Streetlight not working", "severity": 2, "severity_label": "moderate", "summary": "The street light is not working.", "quote": "Street light not working.", "time_local": "2026-10-10 07:33:30", "needs_review": false, "positive": false, "line_ids": [9], "lat": 13.0, "lon": 80.2674254, "osm": "https://www.openstreetmap.org/?mlat=13.000000&mlon=80.267425#map=19/13.000000/80.267425"}, {"id": 6, "category": "garbage", "label": "Garbage", "severity": 2, "severity_label": "moderate", "summary": "A garbage dump near the corner smells bad.", "quote": "Garbage dump near the corner, smells bad.", "time_local": "2026-10-10 07:34:10", "needs_review": false, "positive": false, "line_ids": [11], "lat": 13.0001134, "lon": 80.2677658, "osm": "https://www.openstreetmap.org/?mlat=13.000113&mlon=80.267766#map=19/13.000113/80.267766"}, {"id": 7, "category": "waterlogging", "label": "Waterlogging", "severity": 2, "severity_label": "moderate", "summary": "Water logging is present even after rain two days ago.", "quote": "Water logging here even though it rained two days ago.", "time_local": "2026-10-10 07:35:00", "needs_review": false, "positive": false, "line_ids": [12], "lat": 13.000678, "lon": 80.2677658, "osm": "https://www.openstreetmap.org/?mlat=13.000678&mlon=80.267766#map=19/13.000678/80.267766"}, {"id": 8, "category": "good_footpath", "label": "Good footpath", "severity": 1, "severity_label": "minor", "summary": "The footpath is wide and in good condition.", "quote": "Footpath here is nice and wide, really good.", "time_local": "2026-10-10 07:35:40", "needs_review": false, "positive": true, "line_ids": [13], "lat": 13.0011254, "lon": 80.2677658, "osm": "https://www.openstreetmap.org/?mlat=13.001125&mlon=80.267766#map=19/13.001125/80.267766"}, {"id": 9, "category": "unsafe_crossing", "label": "Unsafe crossing", "severity": 3, "severity_label": "severe", "summary": "There’s no zebra crossing and vehicles travel quickly at the junction.", "quote": "No zebra crossing at this junction and vehicles come very fast.", "time_local": "2026-10-10 07:36:40", "needs_review": false, "positive": false, "line_ids": [14], "lat": 13.001799, "lon": 80.2677658, "osm": "https://www.openstreetmap.org/?mlat=13.001799&mlon=80.267766#map=19/13.001799/80.267766"}, {"id": 10, "category": "blocked_drain", "label": "Blocked or open drain", "severity": 2, "severity_label": "moderate", "summary": "An open drain is next to the school gate without a cover.", "quote": "Open drain right next to the school gate, no cover.", "time_local": "2026-10-10 07:38:20", "needs_review": true, "positive": false, "line_ids": [16], "lat": 13.0026949, "lon": 80.2677658, "osm": "https://www.openstreetmap.org/?mlat=13.002695&mlon=80.267766#map=19/13.002695/80.267766"}]};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
// Canvas renderer with a wide hit tolerance: small circles are easy to tap with a finger.
const map = L.map("map", {renderer: L.canvas({tolerance: 10})});
// Ready-to-paste text for a complaint portal, WhatsApp or email.
function complaintText(f){
  return ["Street problem: " + f.label + " (severity: " + f.severity_label + ")", f.summary,
          f.quote ? "Resident's words: \u201c" + f.quote + "\u201d" : "",
          f.time_local ? "Seen: " + f.time_local : "", "Location: " + f.osm]
    .filter(Boolean).join("\n");
}
// Clipboard API where allowed (https), else the old textarea trick (also works on iOS Safari).
function copyText(t){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise(function(ok, fail){
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    ta.remove();
    if (done) ok(); else fail();
  });
}
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const layers = [], byCategory = {};
if (DATA.track.length > 1) layers.push(L.polyline(DATA.track, {color: "#3388ff", weight: 4, opacity: 0.7}).addTo(map));
DATA.findings.slice().sort(function(a,b){return a.severity-b.severity;}).forEach(function(f){
  const c = DATA.categories[f.category] || DATA.categories.other_problem;
  const m = L.circleMarker([f.lat, f.lon], {radius: 4 + f.severity * 3, fillColor: c.color, fillOpacity: 0.8,
    color: f.needs_review ? "#222" : c.color, weight: f.needs_review ? 2.5 : 2, dashArray: f.needs_review ? "4 3" : null});
  const sev = f.positive ? "Good thing" : "Severity: " + esc(f.severity_label) + " (" + f.severity + "/3)";
  m.bindPopup(function(){
    const el = document.createElement("div");
    el.className = "popup";
    el.innerHTML = '<h3>' + esc(f.label) + '</h3><div><b>' + sev + '</b></div><div>' + esc(f.summary) +
      '</div>' + (f.quote ? '<div class="q">&ldquo;' + esc(f.quote) + '&rdquo;</div>' : '') + '<div>' + esc(f.time_local) +
      '</div>' + (f.needs_review ? '<div class="warn">Location approximate, please check</div>' : '') +
      '<div><a href="' + esc(f.osm) + '" target="_blank" rel="noopener">Open in OpenStreetMap</a></div>' +
      (f.positive ? '' : '<button type="button" class="copy">Copy complaint text</button>');
    const btn = el.querySelector("button.copy");
    if (btn) btn.addEventListener("click", function(ev){
      L.DomEvent.stopPropagation(ev);
      copyText(complaintText(f)).then(function(){ btn.textContent = "Copied \u2713"; },
        function(){ btn.textContent = "Couldn't copy. Select the text above instead."; });
      setTimeout(function(){ btn.textContent = "Copy complaint text"; }, 2500);
    });
    return el;
  }, {maxWidth: 260});
  layers.push(m.addTo(map));
  (byCategory[f.category] = byCategory[f.category] || []).push(m);
});
if (layers.length) map.fitBounds(L.featureGroup(layers).getBounds(), {padding: [24, 24], maxZoom: 18});
else map.setView([20, 78], 4);
const legend = L.control({position: "bottomright"});
legend.onAdd = function(){
  const div = L.DomUtil.create("div", "legend");
  // Collapsed on phones so it doesn't cover the map; open on wider screens.
  const open = window.matchMedia("(min-width: 601px)").matches ? " open" : "";
  let h = "<details" + open + "><summary>Map key</summary>";
  Object.keys(DATA.categories).forEach(function(k){
    const n = DATA.findings.filter(function(f){return f.category === k;}).length;
    if (n) h += '<button type="button" class="cat" data-k="' + k + '" aria-pressed="true"><i style="background:' +
      DATA.categories[k].color + '"></i>' + esc(DATA.categories[k].label) + " (" + n + ")</button>";
  });
  h += '<div class="hint">Tap a category to hide or show it</div>';
  h += '<div style="margin-top:4px;color:#555">Bigger circle = more severe</div>';
  if (DATA.findings.some(function(f){return f.needs_review;})) h += '<div><i class="dash"></i>Location needs review</div>';
  div.innerHTML = h + "</details>";
  div.querySelectorAll("button.cat").forEach(function(b){
    b.addEventListener("click", function(){
      const show = b.classList.toggle("off") === false;
      b.setAttribute("aria-pressed", String(show));
      byCategory[b.dataset.k].forEach(function(m){ if (show) m.addTo(map); else m.remove(); });
    });
  });
  L.DomEvent.disableScrollPropagation(div);
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);
// Place search with OpenStreetMap's Nominatim. Runs only on submit, at most once per second:
// its usage policy forbids search-as-you-type on the free service.
const search = L.control({position: "topright"});
search.onAdd = function(){
  const div = L.DomUtil.create("div", "search");
  div.innerHTML = '<form role="search"><input type="search" name="q" placeholder="Search a place" ' +
    'aria-label="Search a place" enterkeyhint="search" autocomplete="off">' +
    '<button type="submit" aria-label="Search">Go</button></form><div class="results" hidden></div>';
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  const form = div.querySelector("form"), input = form.q, go = form.querySelector("button");
  const results = div.querySelector(".results");
  let last = 0, pin = null;
  function show(h){ results.innerHTML = h; results.hidden = !h; }
  function clearPin(){ if (pin) { pin.remove(); pin = null; } }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    const q = input.value.trim();
    if (!q || go.disabled) return;
    go.disabled = true;
    show('<div class="msg">Searching…</div>');
    setTimeout(function(){
      last = Date.now();
      const b = map.getBounds();
      const box = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].map(function(v){return v.toFixed(5);}).join(",");
      fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&viewbox=" + box +
            "&q=" + encodeURIComponent(q), {headers: {"Accept": "application/json"}})
        .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(list){
          if (!list.length) { show('<div class="msg">No places found. Try adding the area or city.</div>'); return; }
          show(list.map(function(p, i){
            return '<button type="button" data-i="' + i + '">' + esc(p.display_name) + '</button>';
          }).join(""));
          results.querySelectorAll("button").forEach(function(el){
            el.addEventListener("click", function(ev){
              // show("") below removes this button, so Leaflet can't tell the click came from the
              // search box and would treat it as a map click that closes the new pin's popup.
              L.DomEvent.stopPropagation(ev);
              const p = list[+el.dataset.i], bb = p.boundingbox.map(Number);
              clearPin();
              pin = L.marker([+p.lat, +p.lon], {title: p.display_name}).addTo(map).bindPopup(esc(p.display_name));
              map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], {maxZoom: 18});
              pin.openPopup();
              show("");
              input.blur();
            });
          });
        })
        .catch(function(){ show('<div class="msg">Search failed. It needs an internet connection.</div>'); })
        .finally(function(){ go.disabled = false; });
    }, Math.max(0, last + 1000 - Date.now()));
  });
  input.addEventListener("search", function(){ if (!input.value) { show(""); clearPin(); } });  // the clear (×) button
  return div;
};
search.addTo(map);
</script>
